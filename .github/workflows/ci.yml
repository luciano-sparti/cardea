name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rust-version: [stable, beta, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-version }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

  msrv:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88

      - name: Verify build on MSRV
        run: cargo check --all-targets --locked

      - name: Verify tests on MSRV
        run: cargo test --all-targets --locked

  build-binaries:
    needs: [test, msrv]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build binary for ${{ matrix.target }}
        run: cross build --target ${{ matrix.target }} --release --bin cardea

      - name: Build host tools for asset generation
        run: cargo build --release --bin cardea

      - name: Package release archive
        run: |
          mkdir -p staging/completions staging/man staging/assets
          cp target/${{ matrix.target }}/release/cardea staging/
          cp README.md LICENSE install.sh staging/
          cp assets/cardea.desktop staging/assets/
          target/release/cardea --generate-completions bash > staging/completions/cardea.bash
          target/release/cardea --generate-completions zsh > staging/completions/_cardea
          target/release/cardea --generate-completions fish > staging/completions/cardea.fish
          target/release/cardea --generate-manpage > staging/man/cardea.1
          cd staging
          tar -czvf ../cardea-${{ matrix.target }}.tar.gz *
          cd ..

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardea-${{ matrix.target }}
          path: cardea-${{ matrix.target }}.tar.gz

  release:
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum cardea-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/cardea-*.tar.gz
            release-artifacts/SHA256SUMS
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}